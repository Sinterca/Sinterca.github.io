<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' fill='%230a1628'/%3E%3Ctext x='256' y='320' font-family='Arial Black' font-weight='900' font-size='180' fill='%23c9973a' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0a1628; --navy2:#112240; --navy3:#0d1e35;
  --gold:#c9973a; --gold2:#f0c060;
  --teal:#00c9a7; --red:#e74c3c; --orange:#f39c12; --purple:#9b59b6;
  --text:#e8eaf0; --text2:#8899aa;
  --card:rgba(255,255,255,0.05); --border:rgba(201,151,58,0.3);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;background:var(--navy);color:var(--text);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 20%,rgba(201,151,58,0.08) 0%,transparent 60%),radial-gradient(ellipse at 80% 80%,rgba(0,201,167,0.06) 0%,transparent 60%);pointer-events:none;z-index:0;}
.screen{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* LOGIN */
#loginScreen{justify-content:center;align-items:center;padding:24px;background:linear-gradient(160deg,#0a1628 0%,#112240 100%);}
.logo-block{text-align:center;margin-bottom:36px;}
.logo-block .brand{font-family:'Rajdhani',sans-serif;font-size:2.8rem;font-weight:700;color:var(--gold);letter-spacing:4px;text-shadow:0 0 30px rgba(201,151,58,0.4);}
.logo-block .subtitle{font-size:0.78rem;color:var(--text2);letter-spacing:3px;text-transform:uppercase;margin-top:4px;}
.logo-divider{width:60px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:12px auto;}
.login-card{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:20px;padding:32px 28px;width:100%;max-width:360px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,0.4);}
.login-card h2{font-family:'Rajdhani',sans-serif;font-size:1.3rem;color:var(--gold2);letter-spacing:2px;text-align:center;margin-bottom:24px;}

/* BIOMETRIC BUTTON */
.btn-biometric{width:100%;padding:14px;background:linear-gradient(135deg,rgba(0,201,167,0.15),rgba(0,201,167,0.08));border:1px solid rgba(0,201,167,0.4);border-radius:12px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--teal);letter-spacing:1px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px;}
.btn-biometric:active{transform:scale(0.97);}
.btn-biometric .bio-icon{font-size:1.4rem;}
.bio-divider{display:flex;align-items:center;gap:10px;margin:4px 0 16px;}
.bio-divider span{font-size:0.72rem;color:var(--text2);white-space:nowrap;}
.bio-divider::before,.bio-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,0.08);}

/* QUICK LOGIN (saved user) */
.quick-login{background:rgba(201,151,58,0.06);border:1px solid rgba(201,151,58,0.2);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:none;}
.quick-login.show{display:block;}
.quick-login-label{font-size:0.68rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;}
.quick-login-user{display:flex;align-items:center;gap:10px;}
.quick-login-avatar{width:38px;height:38px;border-radius:50%;background:var(--navy2);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;}
.quick-login-name{flex:1;}
.quick-login-name .ql-name{font-weight:700;font-size:0.9rem;}
.quick-login-name .ql-role{font-size:0.72rem;color:var(--text2);}
.btn-ql-change{font-size:0.68rem;color:var(--text2);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0;}

/* REMEMBER ME */
.remember-row{display:flex;align-items:center;gap:8px;margin-top:-6px;margin-bottom:16px;}
.remember-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--teal);cursor:pointer;}
.remember-row label{font-size:0.78rem;color:var(--text2);cursor:pointer;}
.field{margin-bottom:18px;}
.field label{font-size:0.75rem;color:var(--text2);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;padding:13px 16px;background:rgba(255,255,255,0.06);border:1px solid rgba(201,151,58,0.2);border-radius:10px;color:var(--text);font-size:1rem;font-family:'Nunito',sans-serif;outline:none;transition:border-color 0.2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);background:rgba(201,151,58,0.08);}
.field select option{background:var(--navy2);color:var(--text);}
.field-pass{position:relative;}
.field-pass input{padding-right:46px;}
.eye-btn{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--text2);font-size:1.1rem;line-height:1;}
.btn-primary{width:100%;padding:14px;background:linear-gradient(135deg,var(--gold),#a07020);border:none;border-radius:12px;font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;color:#0a1628;letter-spacing:2px;cursor:pointer;transition:transform 0.15s;box-shadow:0 4px 20px rgba(201,151,58,0.3);}
.btn-primary:active{transform:scale(0.97);}
.login-error{color:var(--red);font-size:0.82rem;text-align:center;margin-top:10px;display:none;}

/* TOPBAR */
#appScreen{display:flex;flex-direction:column;}
.topbar{background:var(--navy2);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar .brand-sm{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;color:var(--gold);letter-spacing:3px;}
.topbar .user-info{font-size:0.75rem;color:var(--text2);}
.btn-logout{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);color:var(--red);border-radius:8px;padding:6px 12px;font-size:0.75rem;cursor:pointer;font-family:'Nunito',sans-serif;}

/* TABS */
.tabs{display:flex;background:var(--navy2);border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{flex:1;min-width:70px;padding:11px 4px;text-align:center;font-family:'Rajdhani',sans-serif;font-size:0.78rem;font-weight:600;letter-spacing:0.5px;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;white-space:nowrap;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.tab-content{display:none;flex:1;}
.tab-content.active{display:flex;flex-direction:column;}

/* SCAN */
#scanTab{padding:20px;gap:16px;}
.scan-area{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;}
#videoContainer{position:relative;background:#000;border-radius:16px 16px 0 0;}
#qrVideo{width:100%;display:block;max-height:260px;object-fit:cover;}
.scan-overlay{position:absolute;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;}
.scan-frame{width:180px;height:180px;position:relative;}
.scan-frame::before,.scan-frame::after,.scan-frame .corner-bl,.scan-frame .corner-br{content:'';position:absolute;width:24px;height:24px;border-color:var(--gold);border-style:solid;}
.scan-frame::before{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
.scan-frame::after{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
.scan-frame .corner-bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
.scan-frame .corner-br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
.scan-line{position:absolute;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:scanAnim 2s linear infinite;box-shadow:0 0 8px var(--gold);}
@keyframes scanAnim{0%{top:10%}100%{top:90%}}
.scan-status{padding:12px 16px;font-size:0.85rem;color:var(--text2);text-align:center;border-top:1px solid var(--border);}
.btn-scan{width:100%;padding:16px;background:linear-gradient(135deg,#00c9a7,#008a72);border:none;border-radius:14px;font-family:'Rajdhani',sans-serif;font-size:1.2rem;font-weight:700;color:#fff;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 20px rgba(0,201,167,0.3);transition:transform 0.15s;}
.btn-scan:active{transform:scale(0.97);}
.btn-scan.scanning{background:linear-gradient(135deg,#e74c3c,#c0392b);box-shadow:0 4px 20px rgba(231,76,60,0.3);}
.result-card{background:rgba(0,201,167,0.08);border:1px solid rgba(0,201,167,0.4);border-radius:14px;padding:16px;display:none;}
.result-card.show{display:block;}
.result-card.entrada{border-color:rgba(0,201,167,0.5);background:rgba(0,201,167,0.08);}
.result-card.salida{border-color:rgba(240,192,96,0.5);background:rgba(240,192,96,0.06);}
.result-card.error{border-color:rgba(231,76,60,0.5);background:rgba(231,76,60,0.06);}
.result-card.bloqueado{border-color:rgba(231,76,60,0.7);background:rgba(231,76,60,0.1);}
.result-badge{display:inline-block;padding:3px 12px;border-radius:20px;font-family:'Rajdhani',sans-serif;font-size:0.85rem;font-weight:700;letter-spacing:1px;margin-bottom:10px;}
.entrada .result-badge{background:rgba(0,201,167,0.2);color:var(--teal);}
.salida .result-badge{background:rgba(240,192,96,0.2);color:var(--gold2);}
.error .result-badge,.bloqueado .result-badge{background:rgba(231,76,60,0.2);color:var(--red);}
.result-name{font-size:1.1rem;font-weight:700;margin-bottom:4px;}
.result-meta{font-size:0.82rem;color:var(--text2);line-height:1.6;}
.result-time{font-family:'Rajdhani',sans-serif;font-size:1.5rem;color:var(--gold2);margin-top:6px;}
.result-extras{font-size:0.78rem;color:var(--orange);margin-top:4px;font-weight:700;}
.gps-badge{display:inline-block;font-size:0.72rem;padding:2px 8px;border-radius:10px;margin-top:6px;background:rgba(0,201,167,0.1);color:var(--teal);border:1px solid rgba(0,201,167,0.3);}
.block-reason{font-size:0.88rem;color:var(--red);margin-top:8px;padding:8px 12px;background:rgba(231,76,60,0.08);border-radius:8px;border-left:3px solid var(--red);}

/* VERIFY MODAL */
.modal-overlay{position:fixed;inset:0;z-index:200;background:rgba(10,22,40,0.97);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;gap:14px;overflow-y:auto;}
.modal-overlay.hidden{display:none!important;}
.modal-title{font-family:'Rajdhani',sans-serif;font-size:1.4rem;font-weight:700;color:var(--gold);letter-spacing:2px;text-align:center;}
.modal-sub{font-size:0.82rem;color:var(--text2);text-align:center;line-height:1.5;}
#photoVideo{width:200px;height:200px;border-radius:16px;object-fit:cover;border:2px solid var(--border);}
.photo-preview{width:200px;height:200px;border-radius:16px;object-fit:cover;border:2px solid var(--gold);display:none;}
.photo-preview.show{display:block;}
.face-compare{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;}
.face-box{text-align:center;}
.face-label{font-size:0.68rem;color:var(--text2);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;}
.face-img{width:130px;height:130px;border-radius:12px;object-fit:cover;border:2px solid var(--border);}
.face-img.ref{border-color:var(--gold);}
.face-img.new{border-color:var(--teal);}
.confidence-bar{width:100%;max-width:300px;}
.confidence-label{font-size:0.75rem;color:var(--text2);margin-bottom:6px;text-align:center;}
.conf-track{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden;}
.conf-fill{height:100%;border-radius:4px;transition:width 0.5s ease;}
.conf-fill.high{background:var(--teal);}
.conf-fill.med{background:var(--orange);}
.conf-fill.low{background:var(--red);}
.conf-value{text-align:center;font-family:'Rajdhani',sans-serif;font-size:1.1rem;font-weight:700;margin-top:4px;}
.gps-status{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:0.8rem;color:var(--text2);text-align:center;width:100%;max-width:340px;}
.gps-ok{border-color:rgba(0,201,167,0.5);color:var(--teal);}
.gps-fail{border-color:rgba(231,76,60,0.4);color:var(--red);}
.verify-actions{display:flex;gap:10px;width:100%;max-width:340px;flex-wrap:wrap;}
.btn-v{flex:1;min-width:90px;padding:12px 8px;border-radius:12px;font-family:'Rajdhani',sans-serif;font-size:0.9rem;font-weight:700;letter-spacing:1px;cursor:pointer;border:none;transition:opacity 0.2s;}
.btn-v:disabled{opacity:0.35;cursor:not-allowed;}
.btn-v.ok{background:linear-gradient(135deg,var(--teal),#008a72);color:#fff;}
.btn-v.cancel{background:rgba(231,76,60,0.15);border:1px solid rgba(231,76,60,0.3);color:var(--red);}
.btn-v.update{background:rgba(201,151,58,0.15);border:1px solid rgba(201,151,58,0.3);color:var(--gold2);}
.btn-photo{width:100%;max-width:340px;padding:13px;background:linear-gradient(135deg,#1a3a6b,#0f2244);border:1px solid rgba(201,151,58,0.3);border-radius:12px;font-family:'Rajdhani',sans-serif;font-size:1rem;font-weight:700;color:var(--gold2);letter-spacing:1px;cursor:pointer;}
.btn-photo.taken{border-color:rgba(0,201,167,0.5);color:var(--teal);}
.ai-thinking{display:flex;flex-direction:column;align-items:center;gap:10px;}
.spinner{width:32px;height:32px;border:3px solid rgba(201,151,58,0.2);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* RECORDS */
#recordsTab{padding:16px;gap:12px;}
.records-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;}
.records-header h3{font-family:'Rajdhani',sans-serif;font-size:1.1rem;color:var(--gold);letter-spacing:1px;}
.filter-date{padding:7px 12px;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Nunito',sans-serif;font-size:0.82rem;outline:none;}
.stats-row{display:flex;gap:8px;flex-wrap:wrap;}
.stat-box{flex:1;min-width:65px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;}
.stat-num{font-family:'Rajdhani',sans-serif;font-size:1.6rem;font-weight:700;color:var(--gold2);line-height:1;}
.stat-lbl{font-size:0.62rem;color:var(--text2);margin-top:3px;text-transform:uppercase;letter-spacing:1px;}
.stat-box.extra{border-color:rgba(243,156,18,0.4);}
.stat-box.extra .stat-num{color:var(--orange);}
.record-list{display:flex;flex-direction:column;gap:8px;}
.record-item{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px 14px;display:flex;align-items:flex-start;gap:12px;}
.record-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:5px;box-shadow:0 0 6px currentColor;}
.record-dot.entrada{color:var(--teal);background:var(--teal);}
.record-dot.salida{color:var(--gold2);background:var(--gold2);}
.record-dot.pending{color:var(--text2);background:var(--text2);}
.record-info{flex:1;min-width:0;}
.record-name{font-weight:700;font-size:0.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.record-sub{font-size:0.72rem;color:var(--text2);margin-top:2px;}
.record-extras-tag{display:inline-block;margin-top:5px;padding:2px 8px;background:rgba(243,156,18,0.12);border:1px solid rgba(243,156,18,0.3);border-radius:10px;font-size:0.68rem;color:var(--orange);font-weight:700;}
.record-times{text-align:right;font-size:0.75rem;color:var(--text2);flex-shrink:0;}
.record-times .in{color:var(--teal);font-weight:700;}
.record-times .out{color:var(--gold2);font-weight:700;}
.empty-state{text-align:center;padding:40px 20px;color:var(--text2);font-size:0.9rem;}
.empty-state .icon{font-size:2.5rem;margin-bottom:8px;opacity:0.4;}

/* WORKERS */
#workersTab{padding:16px;gap:12px;}
.worker-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;margin-bottom:8px;}
.worker-avatar{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;background:var(--navy2);}
.worker-avatar-placeholder{width:54px;height:54px;border-radius:50%;background:var(--navy2);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.worker-info{flex:1;min-width:0;}
.worker-name{font-weight:700;font-size:0.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.worker-sub{font-size:0.72rem;color:var(--text2);margin-top:2px;}
.worker-blocked{font-size:0.7rem;color:var(--red);margin-top:3px;font-weight:700;}
.btn-edit-worker{background:rgba(201,151,58,0.12);border:1px solid rgba(201,151,58,0.3);color:var(--gold2);border-radius:8px;padding:6px 10px;font-size:0.72rem;cursor:pointer;font-family:'Nunito',sans-serif;white-space:nowrap;}

/* ADMIN */
#adminTab{padding:16px;gap:16px;}
.admin-section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px;}
.admin-section h4{font-family:'Rajdhani',sans-serif;font-size:1rem;color:var(--gold);letter-spacing:1px;margin-bottom:14px;}
.user-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.user-row:last-child{border-bottom:none;}
.user-row-info{flex:1;min-width:0;}
.user-row-name{font-size:0.88rem;font-weight:700;}
.user-row-sub{font-size:0.72rem;color:var(--text2);margin-top:2px;}
.btn-sm{padding:5px 10px;border-radius:7px;font-size:0.72rem;cursor:pointer;font-family:'Nunito',sans-serif;border:none;margin-left:4px;}
.btn-sm.edit{background:rgba(201,151,58,0.15);border:1px solid rgba(201,151,58,0.3);color:var(--gold2);}
.btn-sm.del{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.3);color:var(--red);}
.btn-sm.block{background:rgba(231,76,60,0.12);border:1px solid rgba(231,76,60,0.3);color:var(--red);}
.btn-sm.unblock{background:rgba(0,201,167,0.12);border:1px solid rgba(0,201,167,0.3);color:var(--teal);}
.btn-add{width:100%;padding:12px;background:rgba(0,201,167,0.1);border:1px dashed rgba(0,201,167,0.4);border-radius:10px;color:var(--teal);font-family:'Rajdhani',sans-serif;font-size:0.95rem;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:10px;}
.log-entry{padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.75rem;color:var(--text2);line-height:1.5;}
.log-entry:last-child{border-bottom:none;}
.log-entry .log-time{color:var(--gold2);font-weight:700;}
